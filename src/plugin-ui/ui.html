<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font: 12px/1.4 Inter, system-ui, sans-serif;
        color: var(--figma-color-text, #333);
        background: var(--figma-color-bg, #fff);
      }
      main {
        display: grid;
        gap: 8px;
        padding: 12px 16px;
      }
      p {
        margin: 0;
      }
      .status {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f5a623;
      }
      .dot[data-tone="ok"] {
        background: #14ae5c;
      }
      .dot[data-tone="error"] {
        background: #f24822;
      }
      .title {
        font-weight: 600;
      }
      .detail {
        color: var(--figma-color-text-secondary, #666);
      }
      form {
        display: flex;
        gap: 8px;
      }
      /* The display rules above would show a hidden element: the pairing field only while pairing. */
      [hidden] {
        display: none;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 4px 8px;
        font: inherit;
        letter-spacing: 0.2em;
      }
      button {
        font: inherit;
      }
      .edits {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .edits input {
        flex: none;
      }
    </style>
  </head>
  <body>
    <!-- Every text here is ours: the file's own names reach the window only by message, as textContent (FX-001). -->
    <main>
      <strong id="brand"></strong>
      <div class="status"><span id="dot" class="dot"></span><p id="title" class="title"></p></div>
      <p id="detail" class="detail"></p>
      <form id="pairing" hidden>
        <input
          id="code"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="000000"
          aria-label="Pairing code"
        />
        <button type="submit">Pair</button>
      </form>
      <p id="pairing-note" class="detail" hidden></p>
      <label class="edits"><input id="allow-edits" type="checkbox" /> Allow edits</label>
    </main>
    <script>
      /* ui.js */
    </script>
  </body>
</html>
